
name: XDP Firewall CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            linux-tools-common \
            libbpf-dev \
            libelf-dev \
            zlib1g-dev

          if ! command -v bpftool >/dev/null 2>&1; then
            echo "Error: bpftool executable was not found"
            exit 1
          fi

          bpftool version

      - name: Show toolchain versions
        run: |
          gcc --version
          clang --version
          bpftool version

      - name: Build firewall
        run: make

      - name: Run parser tests
        run: make run_parser_test

      - name: Run inotify tests
        run: make run_inotify_test

      - name: Run XDP filter tests
        run: make run_xdp_test